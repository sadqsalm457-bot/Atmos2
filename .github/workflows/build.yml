name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p /tmp/src
          unzip -q "$(ls *.zip | head -1)" -d /tmp/src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        working-directory: /tmp/src/ImmersiveWeather
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: weather-apk
          path: /tmp/src/ImmersiveWeather/app/build/outputs/apk/debug/*.apk
